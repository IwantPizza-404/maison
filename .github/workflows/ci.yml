name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: maison
          POSTGRES_USER: maison
          POSTGRES_PASSWORD: maison
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U maison" --health-interval 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-secret
      DATABASE_URL: postgres://maison:maison@localhost:5432/maison
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy apps config
      - run: uv run python manage.py makemigrations --check --dry-run --settings=config.settings.test
      # .mo не хранятся в git — компилируем, как при сборке образа (тесты проверяют русские тексты)
      - run: sudo apt-get install -y --no-install-recommends gettext
      - run: uv run python manage.py compilemessages --ignore=.venv --settings=config.settings.test
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  docker:
    # Образы должны собираться — иначе поломка Dockerfile всплывёт только в день деплоя
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t maison-backend backend
      - run: docker build -t maison-frontend frontend

  deploy:
    # После зелёного CI в main — обновление сервера: ./scripts/deploy.sh по SSH.
    # Ключ на сервере ограничен командой деплоя (см. docs/DEPLOY.md, «Автодеплой»).
    # Пока секреты не заданы, деплой пропускается.
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    timeout-minutes: 45
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Проверка настроек
        id: config
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "Секреты деплоя не заданы — пропускаю"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: SSH-ключ
        if: steps.config.outputs.enabled == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Деплой
        if: steps.config.outputs.enabled == 'true'
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
        # Сборка на сервере долгая — держим соединение живым. Команду выбирает сервер
        # (ключ ограничен ./scripts/deploy.sh), слово deploy — только для читаемости лога
        run: >-
          ssh -i ~/.ssh/deploy_key
          -o ServerAliveInterval=30 -o ServerAliveCountMax=10
          "$DEPLOY_USER@$DEPLOY_HOST" deploy
